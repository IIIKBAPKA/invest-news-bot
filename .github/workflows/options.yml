name: Options UOA Scanner

on:
  workflow_dispatch: # Дозволяє ручний запуск кнопкою
  repository_dispatch:
    types: [trigger-options] # Дозволяє запуск через зовнішній POST-запит (webhook)

jobs:
  scan-options:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install yahoo-finance2

      - name: Run Options Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node options_bot.js
